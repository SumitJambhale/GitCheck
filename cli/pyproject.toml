[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-check"
version = "0.1.0"
description = "Pre-Commit Verification Gate & AI Code Comprehension Harness"
authors = [{ name = "GitCheck Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
git-check = "git_check.main:cli"
